<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e134b"/>
      <stop offset="60%" stop-color="#0e0828"/>
      <stop offset="100%" stop-color="#050314"/>
    </radialGradient>
    <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="45%" stop-color="#fef3c7"/>
      <stop offset="85%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="moonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#skyGrad)"/>
  
  <!-- Twinkling stars -->
  <circle cx="120" cy="110" r="4" fill="#fde68a" opacity="0.8"/>
  <circle cx="390" cy="90" r="5" fill="#fde68a" opacity="0.9"/>
  <circle cx="430" cy="220" r="3.5" fill="#fde68a" opacity="0.6"/>
  <circle cx="95" cy="360" r="4.5" fill="#fde68a" opacity="0.7"/>
  <circle cx="370" cy="410" r="3" fill="#fde68a" opacity="0.5"/>
  <circle cx="210" cy="65" r="3" fill="#ffffff" opacity="0.8"/>
  
  <!-- Sleeping Crescent Moon -->
  <g filter="url(#moonGlow)">
    <path d="M 330 130 C 230 130 150 210 150 310 C 150 380 190 440 250 470 C 230 450 215 410 215 365 C 215 260 300 175 405 175 C 380 145 355 130 330 130 Z" fill="url(#moonGrad)"/>
  </g>

  <!-- Sleepy eye on the moon -->
  <path d="M 245 320 Q 265 338 285 320" stroke="#78350f" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75"/>
  
  <!-- Cute nightcap / star puff -->
  <circle cx="405" cy="175" r="14" fill="#ffffff" opacity="0.95"/>
</svg>
